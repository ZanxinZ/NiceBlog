<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#E2E1DE"/></pattern>
  </defs>
  <rect width="1200" height="750" fill="#F7F6F3"/>
  <rect width="1200" height="750" fill="url(#dots)"/>

  <!-- 图标：盾牌 + 飞鸟 -->
  <g transform="translate(170 205)">
    <rect width="300" height="300" rx="68" fill="#8FB3CB"/>
    <path d="M150 42 C 110 54, 78 58, 54 58 L 54 150 C 54 212, 96 250, 150 272 C 204 250, 246 212, 246 150 L 246 58 C 222 58, 190 54, 150 42 Z" fill="#1E5A6E" stroke="#DCE4E8" stroke-width="7"/>
    <path d="M78 136 C 110 124, 132 128, 150 148 C 168 128, 190 124, 222 136 C 196 140, 180 150, 168 164 C 160 172, 156 182, 150 188 C 144 182, 140 172, 132 164 C 120 150, 104 140, 78 136 Z" fill="#E8EEF1"/>
    <text x="150" y="360" text-anchor="middle" font-size="30" font-weight="600" fill="#111111">WiserQuote</text>
    <text x="150" y="396" text-anchor="middle" font-size="19" fill="#787774">智慧名言 · iOS</text>
  </g>

  <!-- 名言卡片 -->
  <g transform="translate(560 170)">
    <rect x="28" y="-22" width="440" height="330" rx="28" fill="#E1ECF4" stroke="#C9DAE7"/>
    <rect width="470" height="360" rx="28" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="1.5"/>
    <text x="40" y="96" font-size="84" font-weight="700" fill="#1E5A6E" font-family="Georgia, serif">“</text>
    <text x="40" y="150" font-size="30" fill="#2F3437">想要成为朋友很快，</text>
    <text x="40" y="196" font-size="30" fill="#2F3437">但友谊是一种慢慢成熟</text>
    <text x="40" y="242" font-size="30" fill="#2F3437">的果实。</text>
    <text x="40" y="306" font-size="20" fill="#787774">— 亚里士多德</text>
    <path d="M392 296 c -6 -8 -20 -8 -20 4 c 0 10 20 20 20 20 c 0 0 20 -10 20 -20 c 0 -12 -14 -12 -20 -4 z" fill="#E5534B"/>
  </g>

  <!-- 功能标签 -->
  <g font-size="18" fill="#2F3437">
    <rect x="560" y="572" width="120" height="44" rx="22" fill="#FFFFFF" stroke="#EAEAEA"/><text x="620" y="600" text-anchor="middle">关注智者</text>
    <rect x="696" y="572" width="120" height="44" rx="22" fill="#FFFFFF" stroke="#EAEAEA"/><text x="756" y="600" text-anchor="middle">桌面小组件</text>
    <rect x="832" y="572" width="120" height="44" rx="22" fill="#FFFFFF" stroke="#EAEAEA"/><text x="892" y="600" text-anchor="middle">每日推送</text>
    <rect x="968" y="572" width="112" height="44" rx="22" fill="#E1F3FE" stroke="#BFDDF2"/><text x="1024" y="600" text-anchor="middle" fill="#1F6C9F">本地存储</text>
  </g>
</svg>
