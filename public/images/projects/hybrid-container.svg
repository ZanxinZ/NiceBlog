<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#E2E1DE"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#787774" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="750" fill="#F7F6F3"/>
  <rect width="1200" height="750" fill="url(#dots)"/>

  <!-- 手机：Native 外壳 + WebView -->
  <g transform="translate(150 95)">
    <rect width="280" height="560" rx="38" fill="#FFFFFF" stroke="#D9D8D5" stroke-width="1.5"/>
    <rect x="110" y="14" width="60" height="8" rx="4" fill="#EAEAEA"/>
    <rect x="16" y="40" width="248" height="56" rx="10" fill="#111111"/>
    <text x="36" y="75" font-size="16" fill="#FFFFFF">Native 导航栏</text>
    <rect x="16" y="108" width="248" height="370" rx="10" fill="#E1F3FE" stroke="#1F6C9F" stroke-dasharray="5 5" stroke-opacity="0.5"/>
    <text x="32" y="136" font-family="Menlo, monospace" font-size="12" fill="#1F6C9F">WKWebView</text>
    <rect x="32" y="152" width="216" height="110" rx="8" fill="#FFFFFF"/>
    <g fill="#BFDDF2"><rect x="32" y="280" width="180" height="10" rx="5"/><rect x="32" y="300" width="200" height="10" rx="5"/><rect x="32" y="320" width="140" height="10" rx="5"/></g>
    <rect x="32" y="410" width="216" height="46" rx="8" fill="#1F6C9F"/>
    <text x="140" y="439" text-anchor="middle" font-size="15" fill="#FFFFFF">分享</text>
    <rect x="16" y="490" width="248" height="50" rx="10" fill="#F7F6F3" stroke="#EAEAEA"/>
    <g fill="#D9D8D5"><circle cx="66" cy="515" r="9"/><circle cx="140" cy="515" r="9"/><circle cx="214" cy="515" r="9"/></g>
  </g>

  <!-- Bridge -->
  <g transform="translate(468 300)">
    <rect width="150" height="150" rx="12" fill="#FFFFFF" stroke="#EAEAEA"/>
    <text x="75" y="64" text-anchor="middle" font-size="18" font-weight="600" fill="#111111">Bridge</text>
    <rect x="45" y="80" width="60" height="24" rx="12" fill="#EDF3EC"/>
    <text x="75" y="97" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#346538">v2</text>
  </g>
  <g stroke="#787774" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M436 350 L462 350"/>
    <path d="M624 350 L666 350"/>
    <path d="M666 400 L630 400"/>
    <path d="M462 400 L436 400"/>
  </g>

  <!-- 消息日志 -->
  <g transform="translate(680 150)">
    <rect width="400" height="450" rx="12" fill="#FFFFFF" stroke="#EAEAEA"/>
    <line x1="0" y1="40" x2="400" y2="40" stroke="#EAEAEA"/>
    <g fill="#D9D8D5"><circle cx="20" cy="20" r="5"/><circle cx="38" cy="20" r="5"/><circle cx="56" cy="20" r="5"/></g>
    <text x="80" y="25" font-family="Menlo, monospace" font-size="12" fill="#787774">bridge.log</text>
    <g font-family="Menlo, monospace" font-size="14">
      <text x="24" y="84" fill="#787774">14:02:11.204</text>
      <text x="24" y="108" fill="#1F6C9F">→ call("share", id: 17)</text>
      <text x="24" y="130" fill="#2F3437">  { title: "路由实践" }</text>
      <text x="24" y="172" fill="#787774">14:02:11.389</text>
      <text x="24" y="196" fill="#346538">← resolve(id: 17)</text>
      <text x="24" y="218" fill="#2F3437">  { ok: true }</text>
      <text x="24" y="260" fill="#787774">14:02:12.020</text>
      <text x="24" y="284" fill="#1F6C9F">→ call("login", id: 18)</text>
      <text x="24" y="326" fill="#787774">14:02:12.140</text>
      <text x="24" y="350" fill="#9F2F2D">← reject(id: 18)</text>
      <text x="24" y="372" fill="#2F3437">  { code: "CANCELLED" }</text>
    </g>
    <rect x="24" y="398" width="112" height="26" rx="13" fill="#FBF3DB"/>
    <text x="80" y="415" text-anchor="middle" font-family="Menlo, monospace" font-size="11" fill="#956400">4 MESSAGES</text>
  </g>
</svg>
