<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#E2E1DE"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#787774" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="750" fill="#F7F6F3"/>
  <rect width="1200" height="750" fill="url(#dots)"/>

  <!-- 路径状态 -->
  <rect x="300" y="56" width="600" height="52" rx="8" fill="#FFFFFF" stroke="#EAEAEA"/>
  <text x="324" y="89" font-family="Menlo, monospace" font-size="17" fill="#2F3437">path = [<tspan fill="#1F6C9F">.detail("42")</tspan>, <tspan fill="#346538">.settings</tspan>]</text>

  <!-- 三个屏幕 -->
  <g transform="translate(150 150)">
    <rect width="250" height="520" rx="36" fill="#FFFFFF" stroke="#D9D8D5" stroke-width="1.5"/>
    <rect x="95" y="14" width="60" height="8" rx="4" fill="#EAEAEA"/>
    <text x="24" y="84" font-size="26" font-weight="600" fill="#111111">首页</text>
    <g fill="#F7F6F3" stroke="#EAEAEA">
      <rect x="20" y="110" width="210" height="64" rx="10"/>
      <rect x="20" y="186" width="210" height="64" rx="10" fill="#E1F3FE" stroke="#BFDDF2"/>
      <rect x="20" y="262" width="210" height="64" rx="10"/>
      <rect x="20" y="338" width="210" height="64" rx="10"/>
    </g>
    <g fill="#D9D8D5"><rect x="36" y="130" width="110" height="9" rx="4"/><rect x="36" y="148" width="70" height="7" rx="3"/><rect x="36" y="282" width="120" height="9" rx="4"/><rect x="36" y="300" width="80" height="7" rx="3"/><rect x="36" y="358" width="96" height="9" rx="4"/><rect x="36" y="376" width="60" height="7" rx="3"/></g>
    <rect x="36" y="206" width="130" height="9" rx="4" fill="#1F6C9F" opacity="0.6"/><rect x="36" y="224" width="84" height="7" rx="3" fill="#1F6C9F" opacity="0.35"/>
    <text x="125" y="560" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#787774">Root</text>
  </g>

  <g transform="translate(475 150)">
    <rect width="250" height="520" rx="36" fill="#FFFFFF" stroke="#D9D8D5" stroke-width="1.5"/>
    <rect x="95" y="14" width="60" height="8" rx="4" fill="#EAEAEA"/>
    <text x="24" y="58" font-size="15" fill="#1F6C9F">‹ 首页</text>
    <text x="24" y="96" font-size="26" font-weight="600" fill="#111111">详情 #42</text>
    <rect x="20" y="118" width="210" height="140" rx="12" fill="#FBF3DB"/>
    <circle cx="125" cy="188" r="30" fill="none" stroke="#956400" stroke-width="1.5"/>
    <g fill="#D9D8D5"><rect x="20" y="280" width="190" height="9" rx="4"/><rect x="20" y="300" width="160" height="9" rx="4"/><rect x="20" y="320" width="176" height="9" rx="4"/></g>
    <rect x="20" y="440" width="210" height="48" rx="8" fill="#111111"/>
    <text x="125" y="470" text-anchor="middle" font-size="15" fill="#FFFFFF">打开设置</text>
    <text x="125" y="560" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#1F6C9F">.detail("42")</text>
  </g>

  <g transform="translate(800 150)">
    <rect width="250" height="520" rx="36" fill="#FFFFFF" stroke="#D9D8D5" stroke-width="1.5"/>
    <rect x="95" y="14" width="60" height="8" rx="4" fill="#EAEAEA"/>
    <text x="24" y="58" font-size="15" fill="#1F6C9F">‹ 详情</text>
    <text x="24" y="96" font-size="26" font-weight="600" fill="#111111">设置</text>
    <g stroke="#EAEAEA"><line x1="20" y1="150" x2="230" y2="150"/><line x1="20" y1="200" x2="230" y2="200"/><line x1="20" y1="250" x2="230" y2="250"/><line x1="20" y1="300" x2="230" y2="300"/></g>
    <g fill="#D9D8D5"><rect x="20" y="130" width="90" height="9" rx="4"/><rect x="20" y="180" width="70" height="9" rx="4"/><rect x="20" y="230" width="100" height="9" rx="4"/><rect x="20" y="280" width="80" height="9" rx="4"/></g>
    <g><rect x="182" y="124" width="44" height="22" rx="11" fill="#346538"/><circle cx="215" cy="135" r="9" fill="#FFFFFF"/><rect x="182" y="224" width="44" height="22" rx="11" fill="#EAEAEA"/><circle cx="193" cy="235" r="9" fill="#FFFFFF"/></g>
    <text x="125" y="560" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#346538">.settings</text>
  </g>

  <g stroke="#787774" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M404 410 L468 410"/>
    <path d="M729 410 L793 410"/>
