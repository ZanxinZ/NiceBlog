<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EDF3"/><stop offset="1" stop-color="#DCE3EC"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="14" dy="14" stdDeviation="16" flood-color="#A3ACBA" flood-opacity="0.55"/><feDropShadow dx="-12" dy="-12" stdDeviation="14" flood-color="#FFFFFF" flood-opacity="0.9"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- 代码 -->
  <g filter="url(#soft)"><rect x="160" y="250" width="500" height="500" rx="44" fill="#EEF1F5"/></g>
  <rect x="195" y="285" width="430" height="430" rx="26" fill="#1D1D1F"/>
  <text x="240" y="375" font-size="44" font-weight="600" fill="#0A84FF" font-family="Menlo, monospace">&lt;/&gt;</text>
  <g stroke-width="16" stroke-linecap="round">
    <line x1="240" y1="450" x2="520" y2="450" stroke="#5E5E63"/>
    <line x1="280" y1="510" x2="560" y2="510" stroke="#0A84FF"/>
    <line x1="280" y1="570" x2="480" y2="570" stroke="#5E5E63"/>
    <line x1="240" y1="630" x2="440" y2="630" stroke="#5E5E63"/>
  </g>

  <!-- 箭头 -->
  <g fill="none" stroke="#0071E3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <line x1="710" y1="500" x2="880" y2="500"/>
    <path d="M845 462 L885 500 L845 538"/>
  </g>
  <text x="795" y="450" font-size="30" font-weight="600" fill="#0071E3" text-anchor="middle" font-family="Menlo, monospace">&gt;_ AI</text>

  <!-- 文档 -->
  <g filter="url(#soft)"><rect x="930" y="170" width="510" height="660" rx="44" fill="#EEF1F5"/></g>
  <rect x="965" y="205" width="440" height="590" rx="26" fill="#FFFFFF"/>
  <text x="1010" y="290" font-size="42" font-weight="600" fill="#1D1D1F">技术文档</text>
  <g font-size="30" fill="#1D1D1F">
    <g transform="translate(1010 340)"><rect width="36" height="36" rx="10" fill="#0071E3"/><text x="58" y="29">概述 · 架构</text></g>
    <g transform="translate(1010 410)"><rect width="36" height="36" rx="10" fill="#0071E3"/><text x="58" y="29">核心流程</text></g>
    <g transform="translate(1010 480)"><rect width="36" height="36" rx="10" fill="#0071E3"/><text x="58" y="29">异常与降级</text></g>
    <g transform="translate(1010 550)"><rect width="36" height="36" rx="10" fill="#0071E3"/><text x="58" y="29">源码索引</text></g>
  </g>
  <!-- 迷你流程图 -->
  <g transform="translate(1030 650)" fill="none" stroke="#86868B" stroke-width="5">
    <rect x="0" y="0" width="80" height="50" rx="10"/>
    <rect x="140" y="0" width="80" height="50" rx="10" stroke="#0071E3"/>
    <rect x="280" y="0" width="60" height="50" rx="10"/>
    <line x1="80" y1="25" x2="140" y2="25"/>
    <line x1="220" y1="25" x2="280" y2="25"/>
  </g>
</svg>
