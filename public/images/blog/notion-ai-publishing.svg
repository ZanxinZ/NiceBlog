<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EDF3"/><stop offset="1" stop-color="#DCE3EC"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="14" dy="14" stdDeviation="16" flood-color="#A3ACBA" flood-opacity="0.55"/><feDropShadow dx="-12" dy="-12" stdDeviation="14" flood-color="#FFFFFF" flood-opacity="0.9"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g transform="translate(0 80)">

  <!-- 五个节点 -->
  <g filter="url(#soft)">
    <rect x="120" y="330" width="200" height="200" rx="44" fill="#EEF1F5"/>
    <rect x="410" y="330" width="200" height="200" rx="44" fill="#EEF1F5"/>
    <rect x="700" y="330" width="200" height="200" rx="44" fill="#EEF1F5"/>
    <rect x="990" y="330" width="200" height="200" rx="44" fill="#EEF1F5"/>
    <rect x="1280" y="330" width="200" height="200" rx="44" fill="#EEF1F5"/>
  </g>

  <!-- Notion：文档 -->
  <g transform="translate(220 430)">
    <rect x="-40" y="-50" width="80" height="100" rx="10" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="5"/>
    <text x="0" y="16" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#1D1D1F">N</text>
  </g>
  <!-- Claude：星芒 -->
  <g transform="translate(510 430)" stroke="#D97757" stroke-width="12" stroke-linecap="round">
    <path d="M0 -46 L0 46"/><path d="M-46 0 L46 0"/><path d="M-32 -32 L32 32"/><path d="M-32 32 L32 -32"/>
  </g>
  <!-- Next.js：MDX 代码 -->
  <g transform="translate(800 430)">
    <circle r="50" fill="#1D1D1F"/>
    <text x="0" y="12" text-anchor="middle" font-family="Menlo, monospace" font-size="32" font-weight="700" fill="#FFFFFF">MDX</text>
  </g>
  <!-- GitHub：分支 -->
  <g transform="translate(1090 430)" stroke="#1D1D1F" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M-20 -40 L-20 40"/>
    <path d="M26 -16 C26 14 -20 6 -20 30"/>
    <circle cx="-20" cy="-40" r="11" fill="#EEF1F5"/>
    <circle cx="-20" cy="40" r="11" fill="#EEF1F5"/>
    <circle cx="26" cy="-24" r="11" fill="#EEF1F5"/>
  </g>
  <!-- Website：浏览器 -->
  <g transform="translate(1380 430)">
    <rect x="-56" y="-44" width="112" height="88" rx="12" fill="#FFFFFF" stroke="#0071E3" stroke-width="6"/>
    <path d="M-56 -18 L56 -18" stroke="#0071E3" stroke-width="6"/>
    <circle cx="-40" cy="-31" r="4" fill="#0071E3"/><circle cx="-28" cy="-31" r="4" fill="#0071E3"/>
    <rect x="-38" y="0" width="76" height="8" rx="4" fill="#0071E3" opacity="0.4"/>
    <rect x="-38" y="18" width="50" height="8" rx="4" fill="#0071E3" opacity="0.25"/>
  </g>

  <!-- 名称 -->
  <g font-size="30" font-weight="600" text-anchor="middle" fill="#1D1D1F">
    <text x="220" y="600">Notion</text>
    <text x="510" y="600">Claude</text>
    <text x="800" y="600">Next.js</text>
    <text x="1090" y="600">GitHub</text>
    <text x="1380" y="600">Website</text>
  </g>
  <g font-size="22" text-anchor="middle" fill="#6E6E73">
    <text x="220" y="640">写文章</text>
    <text x="510" y="640">整理格式</text>
    <text x="800" y="640">写入项目</text>
    <text x="1090" y="640">Actions 构建</text>
    <text x="1380" y="640">Pages 发布</text>
  </g>

  <!-- 连接线 -->
  <g stroke="#0071E3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5">
    <path d="M336 430 L394 430"/><path d="M382 418 L394 430 L382 442"/>
    <path d="M626 430 L684 430"/><path d="M672 418 L684 430 L672 442"/>
    <path d="M916 430 L974 430"/><path d="M962 418 L974 430 L962 442"/>
    <path d="M1206 430 L1264 430"/><path d="M1252 418 L1264 430 L1252 442"/>
  </g>
  <g font-family="Menlo, monospace" font-size="18" text-anchor="middle" fill="#0071E3">
    <text x="365" y="404">MCP</text>
    <text x="945" y="404">push</text>
  </g>

  <text x="120" y="230" font-size="56" font-weight="700" fill="#1D1D1F">写完，说一句，网站就更新</text>
  </g>
</svg>
