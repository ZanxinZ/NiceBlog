<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EDF3"/><stop offset="1" stop-color="#DCE3EC"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="14" dy="14" stdDeviation="16" flood-color="#A3ACBA" flood-opacity="0.55"/><feDropShadow dx="-12" dy="-12" stdDeviation="14" flood-color="#FFFFFF" flood-opacity="0.9"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- 两部手机：Local Fallback 覆盖 Remote H5 -->
  <g filter="url(#soft)">
    <rect x="370" y="170" width="320" height="600" rx="58" fill="#EEF1F5"/>
    <rect x="910" y="170" width="320" height="600" rx="58" fill="#EEF1F5"/>
  </g>

  <!-- 左：弱网，本地骨架 + 信号 -->
  <rect x="400" y="220" width="260" height="500" rx="32" fill="#FFFFFF"/>
  <rect x="400" y="220" width="260" height="58" rx="32" fill="#E3E8EF"/>
  <g fill="#D5DCE6">
    <rect x="430" y="308" width="200" height="110" rx="16"/>
    <rect x="430" y="440" width="200" height="14" rx="7"/>
    <rect x="430" y="470" width="140" height="14" rx="7"/>
    <rect x="430" y="516" width="200" height="14" rx="7"/>
    <rect x="430" y="546" width="160" height="14" rx="7"/>
  </g>
  <g transform="translate(530 640)" stroke-linecap="round" fill="none" stroke-width="10">
    <path d="M-44 -6 A62 62 0 0 1 44 -6" stroke="#D5DCE6"/>
    <path d="M-26 12 A36 36 0 0 1 26 12" stroke="#F5A524"/>
    <circle cy="30" r="8" fill="#F5A524" stroke="none"/>
  </g>

  <!-- 右：Remote H5 就绪 -->
  <rect x="940" y="220" width="260" height="500" rx="32" fill="#FFFFFF"/>
  <rect x="940" y="220" width="260" height="58" rx="32" fill="#E3E8EF"/>
  <rect x="970" y="308" width="200" height="110" rx="16" fill="#0071E3" opacity="0.18"/>
  <rect x="970" y="440" width="200" height="14" rx="7" fill="#1D1D1F" opacity="0.7"/>
  <rect x="970" y="470" width="140" height="14" rx="7" fill="#1D1D1F" opacity="0.3"/>
  <rect x="970" y="516" width="200" height="14" rx="7" fill="#1D1D1F" opacity="0.3"/>
  <rect x="970" y="546" width="160" height="14" rx="7" fill="#1D1D1F" opacity="0.3"/>
  <g transform="translate(1070 640)">
    <circle r="30" fill="#30A46C"/>
    <path d="M-13 0 L-3 10 L14 -10" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 箭头 -->
  <g stroke="#6E6E73" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M740 470 L860 470 M836 446 L860 470 L836 494"/>
  </g>
  <text x="800" y="436" font-size="24" text-anchor="middle" fill="#6E6E73">pageReady</text>

  <!-- 文案 -->
  <g font-size="32" font-weight="600" text-anchor="middle" fill="#1D1D1F">
    <text x="530" y="840">Local Fallback</text>
    <text x="1070" y="840">Remote H5</text>
  </g>
  <g font-size="24" text-anchor="middle" fill="#6E6E73">
    <text x="530" y="882">弱网时先展示骨架</text>
    <text x="1070" y="882">就绪后整体替换</text>
  </g>
</svg>
