<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EDF3"/><stop offset="1" stop-color="#DCE3EC"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="14" dy="14" stdDeviation="16" flood-color="#A3ACBA" flood-opacity="0.55"/><feDropShadow dx="-12" dy="-12" stdDeviation="14" flood-color="#FFFFFF" flood-opacity="0.9"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- 三个步骤卡片：打包 → 上传 → 通知 -->
  <g filter="url(#soft)">
    <rect x="170" y="290" width="340" height="340" rx="56" fill="#EEF1F5"/>
    <rect x="630" y="290" width="340" height="340" rx="56" fill="#EEF1F5"/>
    <rect x="1090" y="290" width="340" height="340" rx="56" fill="#EEF1F5"/>
  </g>

  <!-- ① 打包：IPA 包裹 -->
  <g transform="translate(340 450)">
    <rect x="-80" y="-70" width="160" height="140" rx="20" fill="#0071E3" opacity="0.18"/>
    <rect x="-80" y="-70" width="160" height="44" rx="20" fill="#0071E3" opacity="0.45"/>
    <rect x="-14" y="-70" width="28" height="80" fill="#0071E3"/>
    <text y="52" font-size="30" font-weight="700" text-anchor="middle" fill="#0071E3">IPA</text>
  </g>

  <!-- ② 上传：云 + 箭头 -->
  <g transform="translate(800 450)">
    <path d="M-80 40 A46 46 0 0 1 -60 -40 A64 64 0 0 1 60 -44 A46 46 0 0 1 80 40 Z" fill="#F6821F" opacity="0.2"/>
    <path d="M0 50 L0 -20 M-28 8 L0 -20 L28 8" stroke="#F6821F" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ③ 通知：消息气泡 + 二维码 -->
  <g transform="translate(1260 450)">
    <path d="M-90 -70 H90 A20 20 0 0 1 110 -50 V40 A20 20 0 0 1 90 60 H-30 L-60 90 V60 H-90 A20 20 0 0 1 -110 40 V-50 A20 20 0 0 1 -90 -70 Z" fill="#FFFFFF"/>
    <g fill="#1D1D1F">
      <rect x="-80" y="-44" width="36" height="36" rx="4"/>
      <rect x="-32" y="-44" width="16" height="16" rx="3"/>
      <rect x="-80" y="4" width="16" height="16" rx="3"/>
      <rect x="-48" y="4" width="32" height="32" rx="4" opacity="0.6"/>
    </g>
    <rect x="4" y="-40" width="84" height="14" rx="7" fill="#1D1D1F" opacity="0.7"/>
    <rect x="4" y="-12" width="64" height="14" rx="7" fill="#1D1D1F" opacity="0.3"/>
    <rect x="4" y="16" width="76" height="14" rx="7" fill="#1D1D1F" opacity="0.3"/>
    <g transform="translate(96 72)">
      <circle r="28" fill="#30A46C"/>
      <path d="M-12 0 L-3 9 L13 -9" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 箭头 -->
  <g stroke="#6E6E73" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M530 460 L610 460 M586 436 L610 460 L586 484"/>
    <path d="M990 460 L1070 460 M1046 436 L1070 460 L1046 484"/>
  </g>

  <!-- 文案 -->
  <g font-size="32" font-weight="600" text-anchor="middle" fill="#1D1D1F">
    <text x="340" y="710">xcodebuild 打包</text>
    <text x="800" y="710">上传 Cloudflare R2</text>
    <text x="1260" y="710">飞书群通知</text>
  </g>
  <g font-size="24" text-anchor="middle" fill="#6E6E73">
    <text x="340" y="752">IPA · manifest · 安装页</text>
    <text x="800" y="752">OTA 固定路径</text>
    <text x="1260" y="752">扫码即装</text>
  </g>
</svg>
