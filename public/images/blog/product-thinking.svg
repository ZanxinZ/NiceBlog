<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EDF3"/><stop offset="1" stop-color="#DCE3EC"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="14" dy="14" stdDeviation="16" flood-color="#A3ACBA" flood-opacity="0.55"/><feDropShadow dx="-12" dy="-12" stdDeviation="14" flood-color="#FFFFFF" flood-opacity="0.9"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- 证据强度 -->
  <g font-size="22" fill="#6E6E73">
    <text x="110" y="200">证据逐渐增加</text>
  </g>
  <g fill="#0071E3">
    <rect x="110" y="226" width="60" height="14" rx="7" opacity="0.15"/>
    <rect x="186" y="226" width="60" height="14" rx="7" opacity="0.25"/>
    <rect x="262" y="226" width="60" height="14" rx="7" opacity="0.38"/>
    <rect x="338" y="226" width="60" height="14" rx="7" opacity="0.52"/>
    <rect x="414" y="226" width="60" height="14" rx="7" opacity="0.66"/>
    <rect x="490" y="226" width="60" height="14" rx="7" opacity="0.82"/>
    <rect x="566" y="226" width="60" height="14" rx="7"/>
  </g>

  <!-- 流程胶囊 -->
  <g filter="url(#soft)">
    <rect x="110" y="420" width="150" height="96" rx="48" fill="#EEF1F5"/>
    <rect x="290" y="420" width="150" height="96" rx="48" fill="#EEF1F5"/>
    <rect x="470" y="420" width="150" height="96" rx="48" fill="#EEF1F5"/>
    <rect x="670" y="380" width="440" height="176" rx="40" fill="#EEF1F5"/>
    <rect x="1160" y="420" width="150" height="96" rx="48" fill="#EEF1F5"/>
    <rect x="1340" y="420" width="150" height="96" rx="48" fill="#EEF1F5"/>
  </g>

  <g font-size="30" font-weight="600" text-anchor="middle" fill="#1D1D1F">
    <text x="185" y="479">发现</text>
    <text x="365" y="479">判断</text>
    <text x="545" y="479">验证</text>
    <text x="1235" y="479">分发</text>
    <text x="1415" y="479">收费</text>
  </g>

  <!-- 中间：已经很强的构建能力 -->
  <g font-size="30" font-weight="600" text-anchor="middle" fill="#1D1D1F">
    <text x="760" y="479">设计</text>
    <text x="890" y="479">开发</text>
    <text x="1020" y="479">上线</text>
  </g>
  <g fill="#0071E3" font-size="26" text-anchor="middle">
    <text x="825" y="479">·</text>
    <text x="955" y="479">·</text>
  </g>

  <!-- 两端的瓶颈 -->
  <g stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M110 560 L620 560" stroke="#28A745" opacity="0.8"/>
    <path d="M1160 560 L1490 560" stroke="#E5484D" opacity="0.8"/>
  </g>
  <g font-size="26" font-weight="600">
    <text x="110" y="616" fill="#1E7A34">做之前</text>
    <text x="1160" y="616" fill="#B8323A">做之后</text>
  </g>
  <g font-size="22" fill="#6E6E73">
    <text x="110" y="656">Problem Discovery / Validation</text>
    <text x="1160" y="656">Distribution / Monetization</text>
  </g>

  <g text-anchor="middle">
    <path d="M890 600 L890 660" stroke="#0071E3" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M876 614 L890 600 L904 614" stroke="#0071E3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
    <text x="890" y="702" font-size="24" fill="#6E6E73">工程能力：已经很强</text>
  </g>

  <text x="110" y="850" font-size="56" font-weight="700" fill="#1D1D1F">假设 → 验证 → 证据 → 再投入</text>
</svg>
