<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EDF3"/><stop offset="1" stop-color="#DCE3EC"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="14" dy="14" stdDeviation="16" flood-color="#A3ACBA" flood-opacity="0.55"/><feDropShadow dx="-12" dy="-12" stdDeviation="14" flood-color="#FFFFFF" flood-opacity="0.9"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Prompt 输入框 -->
  <g filter="url(#soft)"><rect x="240" y="150" width="1120" height="700" rx="48" fill="#EEF1F5"/></g>
  <rect x="280" y="190" width="1040" height="620" rx="28" fill="#FFFFFF"/>
  <text x="340" y="275" font-size="44" font-weight="600" fill="#0071E3" font-family="Menlo, monospace">&gt;_</text>
  <text x="430" y="275" font-size="44" font-weight="600" fill="#1D1D1F">检查内存泄漏</text>

  <!-- 检查项 -->
  <g font-size="38" fill="#1D1D1F">
    <g transform="translate(340 370)"><rect width="44" height="44" rx="12" fill="#0071E3"/><path d="M11 23 L19 31 L34 14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="36">闭包持有 self</text></g>
    <g transform="translate(340 470)"><rect width="44" height="44" rx="12" fill="#0071E3"/><path d="M11 23 L19 31 L34 14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="36">weak delegate</text></g>
    <g transform="translate(340 570)"><rect width="44" height="44" rx="12" fill="#0071E3"/><path d="M11 23 L19 31 L34 14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="36">Timer · Task · Combine</text></g>
    <g transform="translate(340 670)"><rect width="44" height="44" rx="12" fill="none" stroke="#C3CCD8" stroke-width="5"/><text x="76" y="36" fill="#86868B">SwiftUI 引用对象</text></g>
  </g>

  <!-- 循环引用示意 -->
  <g transform="translate(1080 520)" fill="none" stroke-width="10" stroke-linecap="round">
    <circle cx="0" cy="-80" r="46" stroke="#0071E3"/>
    <circle cx="0" cy="110" r="46" stroke="#E5484D"/>
    <path d="M-60 -60 C-120 0 -120 40 -60 95" stroke="#0071E3"/>
    <path d="M60 90 C120 30 120 -10 60 -65" stroke="#E5484D" stroke-dasharray="4 20"/>
  </g>
</svg>
