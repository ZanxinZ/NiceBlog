<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EDF3"/><stop offset="1" stop-color="#DCE3EC"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0071E3" stop-opacity="0.28"/><stop offset="1" stop-color="#0071E3" stop-opacity="0.04"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="14" dy="14" stdDeviation="16" flood-color="#A3ACBA" flood-opacity="0.55"/><feDropShadow dx="-12" dy="-12" stdDeviation="14" flood-color="#FFFFFF" flood-opacity="0.9"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- 内存曲线卡片 -->
  <g filter="url(#soft)">
    <rect x="200" y="170" width="1200" height="480" rx="48" fill="#EEF1F5"/>
  </g>
  <rect x="240" y="210" width="1120" height="400" rx="28" fill="#FFFFFF"/>

  <!-- 泄漏：持续上涨（虚线，红） -->
  <path d="M300 540 L420 510 L540 470 L660 440 L780 400 L900 370 L1020 330 L1140 300 L1300 250" fill="none" stroke="#E5484D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 22" opacity="0.7"/>

  <!-- 优化后：基本平稳（实线，蓝） -->
  <path d="M300 520 L360 470 L420 480 L480 440 L560 450 L640 445 L720 430 L800 450 L880 440 L960 445 L1040 425 L1120 445 L1200 440 L1300 445 L1300 580 L300 580 Z" fill="url(#area)"/>
  <path d="M300 520 L360 470 L420 480 L480 440 L560 450 L640 445 L720 430 L800 450 L880 440 L960 445 L1040 425 L1120 445 L1200 440 L1300 445" fill="none" stroke="#0071E3" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="300" y1="580" x2="1300" y2="580" stroke="#D5DCE6" stroke-width="4" stroke-linecap="round"/>

  <!-- 三个阶段 -->
  <g filter="url(#soft)">
    <rect x="200" y="740" width="360" height="110" rx="55" fill="#EEF1F5"/>
    <rect x="620" y="740" width="360" height="110" rx="55" fill="#EEF1F5"/>
    <rect x="1040" y="740" width="360" height="110" rx="55" fill="#EEF1F5"/>
  </g>
  <g font-size="40" font-weight="600" fill="#1D1D1F" text-anchor="middle">
    <text x="380" y="809">静态预防</text>
    <text x="800" y="809">运行时定位</text>
    <text x="1220" y="809">自动化回归</text>
  </g>
</svg>
