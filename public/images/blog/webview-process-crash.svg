<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EDF3"/><stop offset="1" stop-color="#DCE3EC"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="14" dy="14" stdDeviation="16" flood-color="#A3ACBA" flood-opacity="0.55"/><feDropShadow dx="-12" dy="-12" stdDeviation="14" flood-color="#FFFFFF" flood-opacity="0.9"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- 三部手机：白屏 → 恢复中 → 已恢复 -->
  <g filter="url(#soft)">
    <rect x="200" y="200" width="300" height="560" rx="56" fill="#EEF1F5"/>
    <rect x="650" y="200" width="300" height="560" rx="56" fill="#EEF1F5"/>
    <rect x="1100" y="200" width="300" height="560" rx="56" fill="#EEF1F5"/>
  </g>

  <!-- ① 白屏：WebContent 进程被终止 -->
  <rect x="230" y="250" width="240" height="460" rx="30" fill="#FFFFFF"/>
  <rect x="230" y="250" width="240" height="56" rx="30" fill="#E3E8EF"/>
  <g transform="translate(350 480)">
    <circle r="62" fill="#FDECEC"/>
    <path d="M-24 -24 L24 24 M24 -24 L-24 24" stroke="#E5484D" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- ② 恢复中：遮罩 + 旋转指示 -->
  <rect x="680" y="250" width="240" height="460" rx="30" fill="#F4F6F9"/>
  <rect x="680" y="250" width="240" height="56" rx="30" fill="#E3E8EF"/>
  <g transform="translate(800 470)" fill="none" stroke-linecap="round">
    <circle r="54" stroke="#D5DCE6" stroke-width="12"/>
    <path d="M0 -54 A54 54 0 0 1 54 0" stroke="#0071E3" stroke-width="12"/>
  </g>
  <rect x="740" y="570" width="120" height="12" rx="6" fill="#0071E3" opacity="0.35"/>

  <!-- ③ 已恢复：H5 内容 -->
  <rect x="1130" y="250" width="240" height="460" rx="30" fill="#FFFFFF"/>
  <rect x="1130" y="250" width="240" height="56" rx="30" fill="#E3E8EF"/>
  <rect x="1160" y="336" width="180" height="110" rx="16" fill="#0071E3" opacity="0.18"/>
  <rect x="1160" y="470" width="180" height="14" rx="7" fill="#1D1D1F" opacity="0.7"/>
  <rect x="1160" y="500" width="130" height="14" rx="7" fill="#1D1D1F" opacity="0.3"/>
  <rect x="1160" y="548" width="180" height="14" rx="7" fill="#1D1D1F" opacity="0.3"/>
  <rect x="1160" y="578" width="150" height="14" rx="7" fill="#1D1D1F" opacity="0.3"/>
  <g transform="translate(1340 660)">
    <circle r="30" fill="#30A46C"/>
    <path d="M-13 0 L-3 10 L14 -10" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 箭头 -->
  <g stroke="#6E6E73" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M530 480 L618 480 M594 456 L618 480 L594 504"/>
    <path d="M980 480 L1068 480 M1044 456 L1068 480 L1044 504"/>
  </g>

  <!-- 文案 -->
  <g font-size="32" font-weight="600" text-anchor="middle" fill="#1D1D1F">
    <text x="350" y="830">进程终止</text>
    <text x="800" y="830">同步 Cookie · 重载</text>
    <text x="1250" y="830">didFinish + ready</text>
  </g>
  <g font-size="24" text-anchor="middle" fill="#6E6E73">
    <text x="350" y="872">H5 白屏</text>
    <text x="800" y="872">最多两次 · 每次 8 秒</text>
    <text x="1250" y="872">关闭遮罩</text>
  </g>
</svg>
