<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EDF3"/><stop offset="1" stop-color="#DCE3EC"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="14" dy="14" stdDeviation="16" flood-color="#A3ACBA" flood-opacity="0.55"/><feDropShadow dx="-12" dy="-12" stdDeviation="14" flood-color="#FFFFFF" flood-opacity="0.9"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- 流程：规划 → 确认 → 实施 -->
  <g filter="url(#soft)">
    <rect x="200" y="200" width="320" height="200" rx="40" fill="#EEF1F5"/>
    <rect x="640" y="200" width="320" height="200" rx="40" fill="#EEF1F5"/>
    <rect x="1080" y="200" width="320" height="200" rx="40" fill="#EEF1F5"/>
  </g>
  <rect x="1110" y="230" width="260" height="140" rx="26" fill="#0071E3"/>
  <g font-size="48" font-weight="600" text-anchor="middle">
    <text x="360" y="317" fill="#1D1D1F">规划</text>
    <text x="800" y="317" fill="#1D1D1F">确认</text>
    <text x="1240" y="317" fill="#FFFFFF">实施</text>
  </g>
  <g fill="none" stroke="#86868B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M550 300 H610 M590 280 L610 300 L590 320"/>
    <path d="M990 300 H1050 M1030 280 L1050 300 L1030 320"/>
  </g>

  <!-- 原则 -->
  <g filter="url(#soft)">
    <rect x="200" y="560" width="1200" height="240" rx="48" fill="#EEF1F5"/>
  </g>
  <rect x="240" y="600" width="1120" height="160" rx="28" fill="#FFFFFF"/>
  <g font-size="46" font-weight="600" text-anchor="middle" font-family="Menlo, monospace">
    <text x="420" y="696" fill="#0071E3">KISS</text>
    <text x="700" y="696" fill="#0071E3">YAGNI</text>
    <text x="980" y="696" fill="#0071E3">DRY</text>
    <text x="1200" y="696" fill="#86868B">// MARK</text>
  </g>
</svg>
